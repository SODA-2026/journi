
name: Protect main branch

on:
  pull_request:
    branches:
      - main

jobs:
  check-source-branch:
    name: Check source branch
    runs-on: ubuntu-latest

    steps:
      - name: Verify source branch
        run: |
          if [ "${{ github.head_ref }}" != "main-developement" ]; then
            echo "::warning::Only main-developement should merge into main."
            echo "Current source branch: ${{ github.head_ref }}"
            exit 0
          fi

          echo "Source branch is main-dev. Approved!"
