spring.application.name=journi
spring.config.import=optional:file:backend/.env[.properties]

#MySQL connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

# Hur Hibernate hanterar databasschemat vid uppstart
spring.jpa.hibernate.ddl-auto=validate

